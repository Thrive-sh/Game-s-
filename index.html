<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EcoBox — God-Sandbox Ekosistem</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#16213e" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; touch-action: none; }
    #canvas { display: block; width: 100vw; height: 100vh; background: #87ceeb; cursor: crosshair; }
    #loading { position: absolute; inset: 0; background: #0f172a; display: grid; place-items: center; z-index: 50; font-size: 1.25rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loading">Memuat modul EcoBox…</div>
  <canvas id="canvas"></canvas>
  <script type="module" src="src/main.js"></script>
</body>
</html>
